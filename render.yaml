services:
  - type: web
    name: medpal-prescription-ocr
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set the secret value in the Render dashboard, not in this file.
      - key: OPENAI_API_KEY
        sync: false
